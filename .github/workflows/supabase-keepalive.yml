name: Supabase keep-alive

# 무료 플랜 프로젝트가 활동 없음으로 일시정지되지 않도록 주기적으로 DB를 호출해요.
# 필요한 Secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       예) https://xxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY  anon(public) 키
on:
  schedule:
    - cron: "17 0 */3 * *" # 3일마다 (UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets가 없어요"; exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          [ "$code" -lt 500 ]
